[project]
name = "ml-kem-testkit"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pyserial==3.5",
]

# Instrument control for hostlab/ (only needed with a real oscilloscope):
#   uv sync --extra scope
[project.optional-dependencies]
scope = [
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
]

# Interactive bench console (includes instrument backends).
gui = [
    "streamlit>=1.37,<2",
    "plotly>=5.24,<7",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
]
